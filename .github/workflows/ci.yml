name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/python/requirements.lock
            backend/python/installer.lock
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Install market-data test dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --require-hashes --only-binary=:all: -r python/installer.lock
          venv/bin/python -m pip install --require-hashes --only-binary=:all: -r python/requirements.lock
          venv/bin/python -m pip check
      - name: Audit installed market-data and installer packages
        run: venv/bin/python ../scripts/security/check-python-audit.py --lock python/requirements.lock --installer-lock python/installer.lock
      - run: npm test
      - run: venv/bin/python -m unittest discover -s python -p 'test_*.py' -v

  portfolio-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/portfolio_lab/requirements.lock
            backend/python/installer.lock
      - name: Install isolated Portfolio Lab dependencies
        run: |
          python -m venv portfolio_lab/venv
          portfolio_lab/venv/bin/python -m pip install --require-hashes --only-binary=:all: -r python/installer.lock
          portfolio_lab/venv/bin/python -m pip install --require-hashes --only-binary=:all: -r portfolio_lab/requirements.lock
          portfolio_lab/venv/bin/python -m pip check
      - name: Audit installed Portfolio Lab and installer packages
        run: portfolio_lab/venv/bin/python ../scripts/security/check-python-audit.py --lock portfolio_lab/requirements.lock --installer-lock python/installer.lock
      - run: portfolio_lab/venv/bin/python -m unittest portfolio_lab/test_worker.py -v

  repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject private runtime files
        run: python3 scripts/security/check-public-files.py
      - name: Test security gate failure handling
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: Install checksum-pinned secret scanner
        run: bash scripts/security/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - name: Scan repository history for secrets
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --config .gitleaks.toml .'
